<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0a0f0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ליגת פיפ״א</title>
<style>
:root{
  --bg:#0a0f0a; --bg2:#0f1710; --card:#141d15; --card2:#1a2a1c;
  --line:#233626; --line2:#2f4a34;
  --txt:#eaf5ea; --dim:#8fae94; --dim2:#6a866f;
  --accent:#39e08a; --accent2:#26c46f; --accentink:#052013;
  --gold:#ffd25a; --silver:#cfe0e6; --bronze:#e0925a;
  --win:#39e08a; --loss:#ff6b6b; --draw:#f4c04b; --tech:#b98bff; --blue:#4aa8ff;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #10251a 0%, var(--bg) 55%) fixed, var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Assistant",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  min-height:100vh;
}
.app{max-width:560px;margin:0 auto;padding:0 14px}
header.top{
  position:sticky;top:0;z-index:40;
  padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
  background:linear-gradient(180deg, rgba(10,15,10,.96), rgba(10,15,10,.75) 70%, transparent);
  backdrop-filter:blur(10px);
  max-width:560px;margin:0 auto;
  display:flex;align-items:center;gap:10px;
}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.3px;font-size:19px}
.logo .ball{width:26px;height:26px;border-radius:50%;background:
   radial-gradient(circle at 35% 30%, #fff 0 22%, transparent 23%),
   conic-gradient(from 20deg,#111,#333 25%,#111 26% 50%,#333 51% 75%,#111 76%);
   box-shadow:0 2px 8px rgba(0,0,0,.5), inset 0 0 0 2px #0006;flex:0 0 auto}
.logo b{color:var(--accent)}
.top .spacer{flex:1}
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--dim2);box-shadow:0 0 0 3px #0003}
.syncdot.on{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.syncdot.err{background:var(--loss)}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:12px;font-size:17px;display:flex;align-items:center;justify-content:center}

h2.section{font-size:13px;letter-spacing:.6px;color:var(--dim);margin:22px 4px 10px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.muted{color:var(--dim)}
.small{font-size:12px}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.tag-win{color:var(--win)} .tag-loss{color:var(--loss)} .tag-draw{color:var(--draw)} .tag-tech{color:var(--tech)}
.btn{appearance:none;border:none;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:800;color:var(--accentink);background:linear-gradient(180deg,var(--accent),var(--accent2));box-shadow:0 8px 20px rgba(57,224,138,.25);width:100%;letter-spacing:.3px}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line2);box-shadow:none}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);box-shadow:none;font-weight:700}
.btn.danger{background:#2a1414;color:#ff8f8f;border:1px solid #522;box-shadow:none}
.btn.tech{background:linear-gradient(180deg,#a879ff,#8b5bff);color:#150826;box-shadow:0 8px 20px rgba(139,91,255,.25)}
.btn:disabled{opacity:.4}
input,select{font-family:inherit;font-size:16px;color:var(--txt);background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px;width:100%;text-align:right}
input::placeholder{color:var(--dim2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.av{flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#06130b;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.av.sm{width:30px;height:30px;font-size:13px}
.av.md{width:40px;height:40px;font-size:16px}
.av.lg{width:64px;height:64px;font-size:26px}

.modeswitch{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.modeswitch button{flex:1;border:none;background:transparent;color:var(--dim);font-weight:800;font-size:15px;padding:11px;border-radius:10px}
.modeswitch button.act{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--accentink)}

.teamsummary{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin-top:12px}
.tsum{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:10px;min-height:66px}
.tsum.a{border-color:rgba(57,224,138,.5)} .tsum.b{border-color:rgba(74,168,255,.5)}
.tsum .tl{font-size:11px;font-weight:800;color:var(--dim);margin-bottom:6px;display:flex;justify-content:space-between;gap:6px}
.tsum .tp{display:flex;flex-wrap:wrap;gap:6px}
.minip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 9px 3px 4px;font-weight:700;font-size:13px}
.vsbig{display:flex;align-items:center;color:var(--dim2);font-weight:900;font-size:12px}
.hintline{font-size:12px;color:var(--dim);text-align:center;margin:12px 0 8px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pchip{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:9px 10px;color:var(--txt);font-weight:700;font-size:15px;text-align:right}
.pchip .pn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip.sel{border-color:var(--accent);background:rgba(57,224,138,.12)}
.pchip.selb{border-color:var(--blue);background:rgba(74,168,255,.12)}
.pchip.guest{border-style:dashed}
.pchip.guest.sel,.pchip.guest.selb{border-color:var(--draw);background:rgba(244,192,75,.12)}
.tbadge{font-size:11px;font-weight:900;border-radius:6px;padding:1px 6px;color:#06130b}
.tbadge.a{background:var(--accent)} .tbadge.b{background:var(--blue)}
.guestnote{margin-top:10px;font-size:12px;font-weight:700;color:var(--draw);background:rgba(244,192,75,.08);border:1px dashed #5a4a2a;border-radius:10px;padding:8px 10px;text-align:center}

/* מגרש בחירה: ריבועים + גרירה */
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:12px;align-items:stretch}
.zone{background:var(--bg2);border:1.5px dashed var(--line2);border-radius:16px;padding:10px;min-height:118px;display:flex;flex-direction:column;gap:8px;transition:background .12s,border-color .12s}
.zone.a{border-color:rgba(57,224,138,.5)} .zone.b{border-color:rgba(74,168,255,.5)}
.zone.over{border-style:solid;background:rgba(57,224,138,.09)}
.zone .zh{font-size:11px;font-weight:800;color:var(--dim);display:flex;justify-content:space-between;gap:6px}
.zone .ztiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center;flex:1}
.zone .zempty{color:var(--dim2);font-size:12px;text-align:center;margin:auto}
.zonemid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--dim2);font-weight:900;font-size:12px}
.poolwrap{margin-top:10px;border:1px solid transparent;border-radius:16px;padding:6px 2px;transition:background .12s}
.poolwrap.over{background:rgba(255,255,255,.04);border-color:var(--line)}
.poollabel{font-size:12px;color:var(--dim);text-align:center;margin:6px 0}
.tilegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.tile{background:var(--card2);border:1.5px solid var(--line2);border-radius:14px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:700;font-size:13px;text-align:center;user-select:none;-webkit-user-select:none;touch-action:none;min-width:70px}
.tile .tn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.a{border-color:var(--accent);background:rgba(57,224,138,.14)}
.tile.b{border-color:var(--blue);background:rgba(74,168,255,.14)}
.tile.guest{border-style:dashed}
.tile.dragging{opacity:.35}
.tile-ghost{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);box-shadow:0 14px 34px rgba(0,0,0,.55);opacity:.96;margin:0}
.tagrow{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.tagtoggle{border:1.5px solid var(--line2);background:var(--card2);color:var(--dim);border-radius:12px;padding:9px 13px;font-weight:800;font-size:14px}
.tagtoggle.on{border-color:#ff9d4a;background:rgba(255,157,74,.14);color:#ffc99a}
.techauto{margin-inline-start:auto;font-size:12px;font-weight:800;color:var(--dim2);border:1px dashed var(--line2);border-radius:999px;padding:5px 11px}
.techauto.on{color:#e6d9ff;border-color:var(--tech);border-style:solid;background:rgba(139,91,255,.14)}

.scorewrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:14px}
.scorebox{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:12px;text-align:center}
.scorebox.a{border-color:rgba(57,224,138,.4)} .scorebox.b{border-color:rgba(74,168,255,.4)}
.scorebox .lab{font-size:11px;color:var(--dim);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scorebox .num{font-size:42px;font-weight:900;line-height:1;margin:6px 0}
.stepbtns{display:flex;gap:6px;justify-content:center}
.stepbtns button{width:38px;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);color:var(--txt);font-size:20px;font-weight:800}
.dash{color:var(--dim2);font-size:26px;font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{border:1px solid var(--line2);background:var(--card2);color:var(--txt);border-radius:11px;padding:8px 11px;font-weight:800;font-size:14px}
.chip.act{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--accentink);border-color:transparent}
.techbar{margin-top:14px;padding:12px;border-radius:14px;border:1px dashed var(--tech);background:rgba(139,91,255,.08)}
.techbar .h{font-weight:800;color:var(--tech);font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.techbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.techbtns button{border:1px solid var(--tech);background:rgba(139,91,255,.12);color:#e6d9ff;border-radius:12px;padding:11px;font-weight:800;font-size:14px}
.techbtns button:disabled{opacity:.4}

.lockbanner{background:rgba(255,107,107,.1);border:1px solid #5a2a2a;color:#ffb3b3;border-radius:12px;padding:10px 12px;font-weight:700;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lockpill{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;border:1px solid var(--line2);background:var(--card2);color:var(--dim)}
.lockpill.open{color:var(--accent);border-color:var(--accent)}
.lockpill.closed{color:var(--loss);border-color:#5a2a2a}
.lockpill.setup{color:var(--draw);border-color:#5a4a2a}

.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:60;display:none}
.sheet-back.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:82vh;overflow:auto}
.sheet.on{transform:translateY(0)}
.grabber{width:42px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}

.lb-row{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--line)}
.lb-row:last-child{border-bottom:none}
.rank{width:26px;text-align:center;font-weight:900;color:var(--dim);font-size:15px;flex:0 0 auto}
.lb-main{flex:1;min-width:0}
.lb-main .nm{font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lb-main .sub{font-size:12px;color:var(--dim);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rating{font-weight:900;font-size:19px;text-align:left}
.rating .d{font-size:11px;font-weight:800;display:block;margin-top:1px}
.up{color:var(--win)} .down{color:var(--loss)} .flat{color:var(--dim2)}
.form{display:flex;gap:3px}
.fdot{width:16px;height:16px;border-radius:5px;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#06130b}
.fW{background:var(--win)} .fL{background:var(--loss);color:#2a0a0a} .fD{background:var(--draw)}
.streakbadge{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px}
.hot{background:linear-gradient(180deg,#ff8a3d,#ff5a3d);color:#2a0a00}
.cold{background:#16344a;color:#8fd0ff}
.techbadge{background:rgba(139,91,255,.18);color:#d9c6ff;border:1px solid var(--tech);font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px}
.friendlybadge{background:rgba(244,192,75,.12);color:var(--draw);border:1px solid #5a4a2a;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px}
.lrbadge{background:rgba(255,157,74,.14);color:#ffbf8a;border:1px solid #6a4a2a;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px}

.match{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:none}
.match .side{flex:1;min-width:0}
.match .side .who{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .side.left{text-align:left}
.match .sc{font-weight:900;font-size:18px;padding:4px 10px;border-radius:11px;background:var(--bg2);border:1px solid var(--line2);white-space:nowrap}
.match .sc.techsc{border-color:var(--tech);background:rgba(139,91,255,.12)}
.match .meta{font-size:11px;color:var(--dim2);margin-top:2px}
.winbold{color:var(--txt)} .losedim{color:var(--dim2)}

.prof-head{display:flex;align-items:center;gap:14px}
.prof-head .nm{font-size:22px;font-weight:900}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center}
.stat .v{font-size:20px;font-weight:900}
.stat .k{font-size:11px;color:var(--dim);margin-top:2px}
.bar{height:10px;border-radius:6px;background:var(--bg2);overflow:hidden;display:flex;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.spark{width:100%;height:56px;display:block}
.h2h-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.h2h-row:last-child{border-bottom:none}
.h2h-rec{font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}

.rec{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:none}
.rec .ic{width:40px;height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.rec .t{font-size:12px;color:var(--dim);font-weight:700}
.rec .v{font-weight:800;margin-top:1px}

nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;max-width:560px;margin:0 auto;
  background:linear-gradient(180deg,rgba(15,23,16,.7),rgba(10,15,10,.98));
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
nav.bottom button{flex:1;background:none;border:none;color:var(--dim2);font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
nav.bottom button .i{font-size:20px;line-height:1}
nav.bottom button.act{color:var(--accent)}

.empty{text-align:center;color:var(--dim);padding:28px 14px}
.empty .big{font-size:40px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line2);color:var(--txt);padding:11px 18px;border-radius:999px;font-weight:800;z-index:80;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.linkish{color:var(--accent);font-weight:800;text-decoration:underline;background:none;border:none;padding:0;font-size:inherit}
.divlist>*{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.kv{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv b{font-weight:800;direction:ltr}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;width:100%;min-height:120px;background:var(--bg2);color:var(--txt);border:1px solid var(--line2);border-radius:12px;padding:10px;direction:ltr;text-align:left}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.seg button{border:1px solid var(--line2);background:var(--card2);color:var(--dim);border-radius:999px;padding:6px 13px;font-weight:800;font-size:13px}
.seg button.act{background:var(--accent);color:var(--accentink);border-color:transparent}
.num,.rating,.scorebox .num,.sc,.rank{direction:ltr}
</style>
</head>
<body>

<header class="top">
  <div class="logo"><span class="ball"></span><span>ליגת<b> פיפ״א</b></span></div>
  <div class="spacer"></div>
  <div id="syncDot" class="syncdot" title="סנכרון"></div>
  <button class="iconbtn" onclick="go('more')">⚙</button>
</header>

<main class="app" id="view"></main>

<nav class="bottom">
  <button data-tab="play" onclick="go('play')"><span class="i">⚽</span>משחק</button>
  <button data-tab="ranks" onclick="go('ranks')"><span class="i">🏆</span>דירוג</button>
  <button data-tab="feed" onclick="go('feed')"><span class="i">📜</span>היסטוריה</button>
  <button data-tab="records" onclick="go('records')"><span class="i">🥇</span>שיאים</button>
  <button data-tab="more" onclick="go('more')"><span class="i">☰</span>עוד</button>
</nav>

<div class="sheet-back" id="sheetBack" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="grabber"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="window.__sbErr=true"></script>

<script>
/* ============================================================
   ליגת פיפ״א — אפליקציה בקובץ יחיד
============================================================ */
const LS_KEY='fifaLeague.he.v2';
const CFG_KEY='fifaLeague.sync.v2';
const COLORS=['#39e08a','#4aa8ff','#ff7ac2','#ffcf5a','#b98bff','#ff8f5a','#5ce1c9','#ff6b6b','#8be04a','#67c0ff','#ffa1d1','#c0f05a'];
const TECH_SCORE=3; // תוצאת ברירת מחדל לניצחון טכני: 3-0
const SQUAD=['רן','דודי','רפא','ביתן','בר','גוטמן','איתמר'];

/* איחוד שחקנים כפולים לפי שם (נוצר כשכמה מכשירים זרעו את הסגל בו-זמנית).
   בוחר מזהה קנוני דטרמיניסטי (הקטן ביותר) כדי שכל המכשירים יתכנסו לאותו מצב,
   ומעביר את כל המשחקים למזהה הקנוני. */
function dedupePlayers(){
  const groups={};
  state.players.forEach(p=>{const k=(p.guest?'g:':'p:')+(p.name||'').trim();(groups[k]||(groups[k]=[])).push(p);});
  const map={};let dup=false;const keepIds=new Set();
  Object.values(groups).forEach(arr=>{
    arr.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
    const canon=arr[0];keepIds.add(canon.id);
    arr.forEach(p=>{map[p.id]=canon.id;if(p.id!==canon.id)dup=true;});
  });
  if(!dup)return false;
  state.matches.forEach(m=>{m.a=m.a.map(id=>map[id]||id);m.b=m.b.map(id=>map[id]||id);});
  state.players=state.players.filter(p=>keepIds.has(p.id));
  return true;
}

/* ============================================================
   מנוע Elo + סטטיסטיקות (טהור)
============================================================ */
const ELO_START=1000, ELO_K=32;
function eloExpected(ra,rb){return 1/(1+Math.pow(10,(rb-ra)/400));}
function movMultiplier(gd,ratingDiffWinner){if(gd===0)return 1;return Math.log(Math.abs(gd)+1)*(2.2/((ratingDiffWinner*0.001)+2.2));}

function computeStats(players,matches){
  const ids=players.map(p=>p.id);
  const R={},S={};
  ids.forEach(id=>{R[id]=ELO_START;S[id]={id,games:0,w:0,d:0,l:0,gf:0,ga:0,history:[{t:0,r:ELO_START}],peak:ELO_START,resultsChrono:[],curStreak:0,curType:'',longestW:0,longestUnb:0,longestL:0,partners:{},opps:{},big:null,mode:{'1v1':{w:0,d:0,l:0,g:0,gf:0,ga:0},'2v2':{w:0,d:0,l:0,g:0,gf:0,ga:0}},lr:{w:0,d:0,l:0,g:0},techW:0,techL:0,closeG:0,closeW:0,cleanSheets:0,scoreFreq:{}};});
  const chem={};
  const sorted=matches.slice().sort((x,y)=>(x.ts-y.ts)||(x.id<y.id?-1:1));
  for(const m of sorted){
    if(!m.a.every(id=>R[id]!=null)||!m.b.every(id=>R[id]!=null))continue;
    const ra=m.a.reduce((s,id)=>s+R[id],0)/m.a.length;
    const rb=m.b.reduce((s,id)=>s+R[id],0)/m.b.length;
    const ea=eloExpected(ra,rb),eb=1-ea;
    const aWin=m.sa>m.sb,bWin=m.sb>m.sa,draw=m.sa===m.sb;
    const sA=aWin?1:(draw?0.5:0),sB=1-sA;
    const gd=Math.abs(m.sa-m.sb);
    const winnerRatingDiff=aWin?(ra-rb):bWin?(rb-ra):0;
    const mov=movMultiplier(gd,winnerRatingDiff);
    const dA=ELO_K*mov*(sA-ea),dB=ELO_K*mov*(sB-eb);
    applyTeam(m.a,m.b,dA,m.sa,m.sb,sA,m);
    applyTeam(m.b,m.a,dB,m.sb,m.sa,sB,m);
    if(m.mode==='2v2'){recordChem(m.a,sA,m.sa,m.sb);recordChem(m.b,sB,m.sb,m.sa);}
  }
  function recordChem(team,res,gf,ga){if(team.length<2)return;for(let i=0;i<team.length;i++)for(let j=i+1;j<team.length;j++){const k=pairKey(team[i],team[j]);const c=chem[k]||(chem[k]={a:team[i],b:team[j],g:0,w:0,d:0,l:0,gf:0,ga:0});c.g++;c.gf+=gf;c.ga+=ga;if(res===1)c.w++;else if(res===0.5)c.d++;else c.l++;}}
  function applyTeam(team,opp,delta,gf,ga,res,m){
    const gd=Math.abs(m.sa-m.sb);
    for(const id of team){
      R[id]+=delta;const st=S[id];st.games++;st.gf+=gf;st.ga+=ga;st.mode[m.mode].g++;st.mode[m.mode].gf+=gf;st.mode[m.mode].ga+=ga;
      if(res===1){st.w++;st.mode[m.mode].w++;if(m.tech)st.techW++;if(m.lr)st.lr.w++;}
      else if(res===0.5){st.d++;st.mode[m.mode].d++;if(m.lr)st.lr.d++;}
      else {st.l++;st.mode[m.mode].l++;if(m.tech)st.techL++;if(m.lr)st.lr.l++;}
      if(m.lr)st.lr.g++;
      if(ga===0)st.cleanSheets++;
      {const sk=gf+'-'+ga;st.scoreFreq[sk]=(st.scoreFreq[sk]||0)+1;}
      if(gd===1){st.closeG++;if(res===1)st.closeW++;}
      st.history.push({t:m.ts,r:R[id]});if(R[id]>st.peak)st.peak=R[id];
      const rc=res===1?'W':res===0.5?'D':'L';st.resultsChrono.push(rc);
      for(const t of team){if(t===id)continue;const pp=st.partners[t]||(st.partners[t]={g:0,w:0,d:0,l:0});pp.g++;if(rc==='W')pp.w++;else if(rc==='D')pp.d++;else pp.l++;}
      for(const o of opp){const oo=st.opps[o]||(st.opps[o]={g:0,w:0,d:0,l:0});oo.g++;if(rc==='W')oo.w++;else if(rc==='D')oo.d++;else oo.l++;}
      if(res===1&&(!st.big||(gf-ga)>st.big.margin))st.big={margin:gf-ga,gf,ga,opp:opp.slice(),ts:m.ts,mode:m.mode,tech:!!m.tech};
    }
  }
  ids.forEach(id=>{
    const st=S[id];st.rating=Math.round(R[id]);
    let cs=0,ct='';for(let i=st.resultsChrono.length-1;i>=0;i--){const r=st.resultsChrono[i];if(i===st.resultsChrono.length-1){ct=r;cs=1;}else if(r===ct){cs++;}else break;}
    st.curStreak=cs;st.curType=ct;
    let lw=0,cur=0,lu=0,curu=0,ll=0,curl=0;
    for(const r of st.resultsChrono){if(r==='W'){cur++;curu++;curl=0;}else if(r==='D'){cur=0;curu++;curl=0;}else{cur=0;curu=0;curl++;}if(cur>lw)lw=cur;if(curu>lu)lu=curu;if(curl>ll)ll=curl;}
    st.longestW=lw;st.longestUnb=lu;st.longestL=ll;
    st.form=st.resultsChrono.slice(-5);st.gd=st.gf-st.ga;
    st.winpct=st.games?(st.w/st.games*100):0;st.ppg=st.games?((st.w*3+st.d)/st.games):0;
    st.gpg=st.games?(st.gf/st.games):0;st.gapg=st.games?(st.ga/st.games):0;
    st.clutchPct=st.closeG?(st.closeW/st.closeG*100):0;
    st.avgMargin=st.games?(st.gd/st.games):0;
    let fk=null,fn=0;for(const k in st.scoreFreq){if(st.scoreFreq[k]>fn){fn=st.scoreFreq[k];fk=k;}}st.favScore=fk;st.favScoreN=fn;
    const h=st.history;st.lastDelta=h.length>1?Math.round(h[h.length-1].r-h[h.length-2].r):0;
    st.bestPartner=pickRel(st.partners,true);st.worstPartner=pickRel(st.partners,false);
    st.nemesis=pickRel(st.opps,false);st.bunny=pickRel(st.opps,true);
  });
  function rate(o){return o.g?(o.w+o.d*0.5)/o.g:0;}
  function pickRel(map,best){let arr=Object.entries(map).filter(([,v])=>v.g>=2);if(!arr.length)return null;arr.sort((a,b)=>best?(rate(b[1])-rate(a[1]))||(b[1].g-a[1].g):(rate(a[1])-rate(b[1]))||(b[1].g-a[1].g));const [id,v]=arr[0];return {id,...v,rate:rate(v)};}
  const chemArr=Object.values(chem).map(c=>({...c,rate:c.g?(c.w+c.d*0.5)/c.g:0}));
  return {S,chem:chemArr,ranked:ids.map(id=>S[id])};
}

function computeRecords(players,matches,stats){
  const rec=[],ms=matches;if(!ms.length)return rec;
  let mg=null;ms.forEach(m=>{const x=Math.max(m.sa,m.sb);if(!mg||x>mg.x)mg={x,m};});
  if(mg){const m=mg.m;const win=m.sa>=m.sb?m.a:m.b;rec.push({ic:'🎯',t:'הכי הרבה שערים במשחק אחד',v:`${teamNames(win)} — ${mg.x} שערים`});}
  let hs=null;ms.forEach(m=>{const t=m.sa+m.sb;if(!hs||t>hs.t)hs={t,m};});
  if(hs){const m=hs.m;rec.push({ic:'🔥',t:'המשחק עם הכי הרבה שערים',v:`${teamNames(m.a)} ${m.sa}–${m.sb} ${teamNames(m.b)} (${hs.t})`});}
  let pk=null;stats.ranked.forEach(s=>{if(s.games&&(!pk||s.peak>pk.peak))pk={peak:Math.round(s.peak),id:s.id};});
  if(pk)rec.push({ic:'📈',t:'הדירוג הגבוה בכל הזמנים',v:`${pname(pk.id)} — ${pk.peak}`});
  let lw=null;stats.ranked.forEach(s=>{if(s.longestW&&(!lw||s.longestW>lw.n))lw={n:s.longestW,id:s.id};});
  if(lw)rec.push({ic:'⚡',t:'רצף הנצחונות הארוך ביותר',v:`${pname(lw.id)} — ${lw.n} ברצף`});
  let lu=null;stats.ranked.forEach(s=>{if(s.longestUnb&&(!lu||s.longestUnb>lu.n))lu={n:s.longestUnb,id:s.id};});
  if(lu)rec.push({ic:'🛡️',t:'הרצף הארוך ללא הפסד',v:`${pname(lu.id)} — ${lu.n} משחקים`});
  let tk=null;stats.ranked.forEach(s=>{if(s.techW&&(!tk||s.techW>tk.n))tk={n:s.techW,id:s.id};});
  if(tk)rec.push({ic:'⚖️',t:'👑 מלך הטכני (נצחונות בפער 3+)',v:`${pname(tk.id)} — ${tk.n} טכניים`});
  let tl=null;stats.ranked.forEach(s=>{if(s.techL&&(!tl||s.techL>tl.n))tl={n:s.techL,id:s.id};});
  if(tl)rec.push({ic:'🏳️',t:'הכי הרבה ספג טכני (הפסד בפער 3+)',v:`${pname(tl.id)} — ${tl.n} פעמים`});
  let lrr=null;stats.ranked.forEach(s=>{if(s.lr.g>=3){const p=(s.lr.w+s.lr.d*0.5)/s.lr.g*100;if(!lrr||p>lrr.p)lrr={p,id:s.id,g:s.lr.g};}});
  if(lrr)rec.push({ic:'🎯',t:'אלוף הלונג ריינג׳ (3+ מש׳)',v:`${pname(lrr.id)} — ${Math.round(lrr.p)}% מתוך ${lrr.g}`});
  let ma=null;stats.ranked.forEach(s=>{if(!ma||s.games>ma.g)ma={g:s.games,id:s.id};});
  if(ma&&ma.g)rec.push({ic:'🏃',t:'הכי הרבה משחקים',v:`${pname(ma.id)} — ${ma.g}`});
  const duos=stats.chem.filter(c=>c.g>=3).sort((a,b)=>b.rate-a.rate||b.g-a.g);
  if(duos.length)rec.push({ic:'🤝',t:'הצמד הקטלני',v:`${pname(duos[0].a)} + ${pname(duos[0].b)} — ${Math.round(duos[0].rate*100)}% (${duos[0].g} מש׳)`});
  let bp=null;stats.ranked.forEach(s=>{if(s.games>=3&&(!bp||s.winpct>bp.p))bp={p:s.winpct,id:s.id};});
  if(bp)rec.push({ic:'👑',t:'אחוז הנצחונות הגבוה (3+ מש׳)',v:`${pname(bp.id)} — ${Math.round(bp.p)}%`});
  let cl=null;stats.ranked.forEach(s=>{if(s.closeG>=3&&(!cl||s.clutchPct>cl.p))cl={p:s.clutchPct,id:s.id,g:s.closeG};});
  if(cl)rec.push({ic:'🧊',t:'מלך הרגעים הצמודים (הכרעה בשער)',v:`${pname(cl.id)} — ${Math.round(cl.p)}% מתוך ${cl.g}`});
  return rec;
}

function entriesOpen(){const c=state.control||{};return !c.pinHash?true:!!c.open;}
function setControl(patch){state.control=Object.assign({open:true,pinHash:null,updatedAt:0},state.control,patch,{updatedAt:now()});save();}
async function sha256(str){
  try{if(window.crypto&&crypto.subtle){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');}}catch(e){}
  let h=5381;for(let i=0;i<str.length;i++){h=((h<<5)+h+str.charCodeAt(i))>>>0;}return 'f'+h.toString(16);
}
function lockPill(){
  if(!state.control||!state.control.pinHash)return `<button class="lockpill setup" onclick="openLockSheet()">⚙ הגדר נעילה</button>`;

}

      <button class="linkish" style="margin-top:14px;display:block;text-align:center;width:100%" onclick="doChangePin()">שינוי סיסמת מנהל</button>`);
  }
}
function genSalt(){return Math.random().toString(36).slice(2)+Date.now().toString(36)+Math.random().toString(36).slice(2);}
async function hashPass(salt,pass){return sha256((salt||'')+'::fifa::'+pass);}
async function doSetPin(){const p=(document.getElementById('pin1').value||'').trim();if(p.length<6)return toast('סיסמה קצרה מדי (6+ תווים)');const salt=genSalt();setControl({salt,pinHash:await hashPass(salt,p),open:false});closeSheet();render();toast('נקבעה סיסמת מנהל · ההזנות נעולות 🔒');}
async function doToggle(){const p=(document.getElementById('pinc').value||'').trim();if(await hashPass(state.control.salt,p)!==state.control.pinHash)return toast('סיסמה שגויה');setControl({open:!state.control.open});closeSheet();render();toast(state.control.open?'הזנות פתוחות 🔓':'הזנות נעולות 🔒');}
async function doChangePin(){const p=prompt('סיסמת מנהל נוכחית:');if(p==null)return;if(await hashPass(state.control.salt,p.trim())!==state.control.pinHash)return toast('סיסמה שגויה');const np=prompt('סיסמה חדשה (6+ תווים):');if(!np||np.trim().length<6)return toast('סיסמה קצרה מדי');const salt=genSalt();setControl({salt,pinHash:await hashPass(salt,np.trim())});toast('הסיסמה עודכנה ✓');}

  const cur=ui.sa+'-'+ui.sb;
  const involvesGuest=[...ui.teamA,...ui.teamB].some(id=>isGuest(id));
  const techThresh=ui.lr?4:3;const gd=Math.abs(ui.sa-ui.sb);const isTech=gd>=techThresh;
  const modeTxt=balanced?(nA===2?'2 נגד 2':'1 נגד 1'):'';
  return `
  <h2 class="section"><span>משחק חדש</span>${lockPill()}</h2>

function teamRatingLabel(team){const real=team.filter(id=>!isGuest(id));if(!real.length||!STATS)return '';const avg=Math.round(real.reduce((s,id)=>s+(STATS.S[id]?.rating||1000),0)/real.length);return `<span class="muted small">ממוצע ${avg}</span>`;}
function teamShort(side){const t=side==='A'?ui.teamA:ui.teamB;return t.map(id=>pname(id).split(/\s+/)[0]).join(' + ');}
function tileHtml(id,zone){const p=P(id);const cls=zone==='A'?'a':zone==='B'?'b':'';return `<div class="tile ${cls} ${p.guest?'guest':''}" data-id="${id}" onpointerdown="tileDown(event,'${id}')">${avatar(id,'md')}<span class="tn">${escapeHtml(p.name)}</span></div>`;}
function zoneHtml(side){const team=side==='A'?ui.teamA:ui.teamB;const tiles=team.map(id=>tileHtml(id,side)).join('');return `<div class="zone ${side==='A'?'a':'b'}" data-drop="${side}"><div class="zh"><span>קבוצה ${side==='A'?'א׳':'ב׳'}</span>${teamRatingLabel(team)}</div><div class="ztiles">${tiles||`<div class="zempty">גררו או הקישו</div>`}</div></div>`;}
function poolHtml(){const used=new Set([...ui.teamA,...ui.teamB]);const pool=state.players.slice().sort((a,b)=>((a.guest?1:0)-(b.guest?1:0))||((STATS.S[b.id]?.rating||1000)-(STATS.S[a.id]?.rating||1000))).filter(p=>!used.has(p.id));return `<div class="poolwrap" data-drop="pool"><div class="poollabel">הקישו על מי ששיחק — או גררו לקבוצה</div><div class="tilegrid">${pool.map(p=>tileHtml(p.id,'pool')).join('')||'<div class="zempty" style="grid-column:1/-1;padding:8px">כל השחקנים נבחרו</div>'}</div></div>`;}
function tapTile(id){const iA=ui.teamA.indexOf(id),iB=ui.teamB.indexOf(id);if(iA>-1)ui.teamA.splice(iA,1);else if(iB>-1)ui.teamB.splice(iB,1);else if(ui.teamA.length<=ui.teamB.length&&ui.teamA.length<2)ui.teamA.push(id);else if(ui.teamB.length<2)ui.teamB.push(id);else{toast('שני הצדדים מלאים (עד 2 בכל צד)');return;}ui.lastReused=false;render();}
function removeFromTeams(id){let i=ui.teamA.indexOf(id);if(i>-1)ui.teamA.splice(i,1);i=ui.teamB.indexOf(id);if(i>-1)ui.teamB.splice(i,1);}
function dropInZone(id,zone){
  const cap=2;
  const from=ui.teamA.includes(id)?'A':ui.teamB.includes(id)?'B':'pool';
  if(zone==='pool'){removeFromTeams(id);ui.lastReused=false;render();return;}
  const arr=zone==='A'?ui.teamA:ui.teamB;
  if(arr.includes(id)){render();return;}
  removeFromTeams(id);
  if(arr.length>=cap){const displaced=arr.pop();if(from==='A'&&ui.teamA.length<cap)ui.teamA.push(displaced);else if(from==='B'&&ui.teamB.length<cap)ui.teamB.push(displaced);}
  arr.push(id);ui.lastReused=false;render();
}
function clearTeams(){ui.teamA=[];ui.teamB=[];ui.lastReused=false;render();}
function toggleLR(){ui.lr=!ui.lr;render();}
function zoneAt(x,y){const el=document.elementFromPoint(x,y);if(!el)return null;const z=el.closest('[data-drop]');return z?z.dataset.drop:null;}
function tileDown(ev,id){
  ev.preventDefault();
  const startX=ev.clientX,startY=ev.clientY,srcEl=ev.currentTarget;
  let moved=false,ghost=null,lastZone=null;
  function move(e){
    const dx=e.clientX-startX,dy=e.clientY-startY;
    if(!moved&&Math.hypot(dx,dy)<8)return;
    moved=true;
    if(!ghost){ghost=srcEl.cloneNode(true);ghost.classList.add('tile-ghost');ghost.classList.remove('dragging');ghost.style.width=srcEl.offsetWidth+'px';document.body.appendChild(ghost);srcEl.classList.add('dragging');}
    ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
    const z=zoneAt(e.clientX,e.clientY);
    if(z!==lastZone){document.querySelectorAll('[data-drop]').forEach(el=>el.classList.remove('over'));if(z){const el=document.querySelector('[data-drop="'+z+'"]');el&&el.classList.add('over');}lastZone=z;}
  }
  function up(e){
    window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);
    document.querySelectorAll('[data-drop]').forEach(el=>el.classList.remove('over'));
    if(ghost)ghost.remove();srcEl.classList.remove('dragging');
    if(moved){const z=zoneAt(e.clientX,e.clientY);if(z)dropInZone(id,z);else render();}
    else tapTile(id);
  }
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
}

function lbRow(s,i,modeSel){

  ${(s.bestPartner||s.worstPartner)?`<h2 class="section"><span>כימיה</span></h2><div class="card">${s.bestPartner?relRow('💚 השותף הכי טוב',s.bestPartner):''}${s.worstPartner&&s.worstPartner.id!==s.bestPartner?.id?relRow('💔 הצמד הכי קשה',s.worstPartner):''}</div>`:''}
  ${(s.bunny||s.nemesis)?`<h2 class="section"><span>יריבויות</span></h2><div class="card">${s.bunny?relRow('😈 הקרבן האהוב',s.bunny):''}${s.nemesis&&s.nemesis.id!==s.bunny?.id?relRow('👹 האויב המושבע',s.nemesis):''}</div>`:''}
  ${h2hCard(s)}
  ${s.big?`<h2 class="section"><span>הנצחון החתום</span></h2><div class="card"><div class="rec"><div class="ic">${s.big.tech?'⚖️':'💥'}</div><div><div class="t">הנצחון הגדול · +${s.big.margin}${s.big.tech?' · טכני':''}</div><div class="v">${s.big.gf}–${s.big.ga} נגד ${escapeHtml(teamNames(s.big.opp))}</div></div></div></div>`:''}`;
}
function relRow(label,r){const pct=Math.round(r.rate*100);return `<div class="h2h-row">${avatar(r.id,'md')}<div style="flex:1"><div class="small muted">${label}</div><b>${escapeHtml(pname(r.id))}</b></div><div style="text-align:left"><div class="h2h-rec">${r.w}-${r.d}-${r.l}</div><div class="small muted">${pct}%</div></div></div>`;}
function h2hCard(s){const opps=Object.entries(s.opps).sort((a,b)=>b[1].g-a[1].g);if(!opps.length)return '';return `<h2 class="section"><span>ראש בראש</span></h2><div class="card">${opps.map(([id,v])=>{const pct=v.g?Math.round((v.w+v.d*0.5)/v.g*100):0;return `<div class="h2h-row">${avatar(id,'sm')}<div style="flex:1"><b>${escapeHtml(pname(id))}</b><div class="small muted">${v.g} משחקים</div></div><div style="width:120px"><div class="bar"><i style="width:${v.g?v.w/v.g*100:0}%;background:var(--win)"></i><i style="width:${v.g?v.d/v.g*100:0}%;background:var(--draw)"></i><i style="width:${v.g?v.l/v.g*100:0}%;background:var(--loss)"></i></div><div class="small muted center" style="margin-top:3px" dir="ltr">${v.w}-${v.d}-${v.l} · ${pct}%</div></div></div>`;}).join('')}</div>`;}
function sparkline(history){
  if(!history||history.length<2)return '<div class="small muted center" style="margin:12px 0">גרף הדירוג יופיע אחרי כמה משחקים.</div>';
  const pts=history.map(h=>h.r);const min=Math.min(...pts),max=Math.max(...pts);const rng=(max-min)||1;
  const W=100,H=56,n=pts.length;const coords=pts.map((r,i)=>[(i/(n-1))*W,H-6-((r-min)/rng)*(H-12)]);
  const d=coords.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area=`M0 ${H} `+coords.map(c=>'L'+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ')+` L${W} ${H} Z`;
  const up=pts[pts.length-1]>=pts[0];const col=up?'#39e08a':'#ff6b6b';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="margin:12px 0 2px;transform:scaleX(-1)"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#g)"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* ============================================================
   סנכרון (Supabase Realtime)
============================================================ */
let SYNC={client:null,channel:null,ok:false,applyingRemote:false,poll:null,lastErr:null};
function getCfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY)||'null');}catch(e){return null;}}
function setCfg(c){localStorage.setItem(CFG_KEY,JSON.stringify(c));}
function clearCfg(){localStorage.removeItem(CFG_KEY);}
function openSyncSheet(){const c=getCfg()||{};openSheet(`<b style="font-size:17px">הגדרת סנכרון ידני</b><p class="small muted" style="margin:6px 0 12px">בדרך כלל אין צורך — הסנכרון מובנה. זה למקרה חירום.</p><input id="s_url" placeholder="https://xxxx.supabase.co" value="${escapeHtml(c.url||'')}" style="margin:4px 0 10px;direction:ltr;text-align:left"><input id="s_key" placeholder="anon key eyJ…" value="${escapeHtml(c.anon||'')}" style="margin:4px 0 10px;direction:ltr;text-align:left"><input id="s_room" placeholder="קוד חדר" value="${escapeHtml(c.room||'')}" style="margin:4px 0 10px;direction:ltr;text-align:left"><button class="btn" onclick="saveSync()">חיבור</button>`);}
function saveSync(){const url=document.getElementById('s_url').value.trim();const anon=document.getElementById('s_key').value.trim();const room=(document.getElementById('s_room').value.trim()||'main').replace(/[^a-zA-Z0-9_-]/g,'-');if(!url||!anon||!room)return toast('צריך URL, מפתח וקוד חדר');setCfg({url,anon,room});closeSheet();initSync(true);render();}
function initSync(announce){
  const cfg=getCfg();if(!cfg)return;
  if(!window.supabase||!window.supabase.createClient){SYNC.ok=false;updateSyncDot();if(announce)toast('אין חיבור — ספריית הסנכרון לא נטענה');return;}
  try{
    SYNC.client=window.supabase.createClient(cfg.url,cfg.anon);
    if(announce)toast('מתחבר…');
    pullRemote(true);
    SYNC.channel=SYNC.client.channel('fifa-'+cfg.room)
      .on('postgres_changes',{event:'*',schema:'public',table:'fifa_rooms',filter:'room=eq.'+cfg.room},payload=>{if(payload.new&&payload.new.data)mergeRemote(payload.new.data);})
      .subscribe(status=>{if(status==='SUBSCRIBED'){SYNC.ok=true;updateSyncDot();}});
    startPolling(); // גיבוי ל-Realtime: מושך עדכונים כל כמה שניות
  }catch(e){SYNC.ok=false;SYNC.lastErr=String(e&&e.message||e);updateSyncDot();if(announce)toast('שגיאת סנכרון');}
}
function pullRemote(seed){
  if(!SYNC.client)return;const cfg=getCfg();if(!cfg)return;
  SYNC.client.from('fifa_rooms').select('data').eq('room',cfg.room).maybeSingle().then(({data,error})=>{
    if(error){SYNC.ok=false;SYNC.lastErr=error.message||error.code||JSON.stringify(error);updateSyncDot();return;}
    SYNC.lastErr=null;
    if(data&&data.data)mergeRemote(data.data);else if(seed)pushState();
    if(seed&&!state.players.length){ensureSquad();render();}
    SYNC.ok=true;updateSyncDot();
  },err=>{SYNC.ok=false;SYNC.lastErr=String(err&&err.message||err);updateSyncDot();});
}
function startPolling(){stopPolling();SYNC.poll=setInterval(()=>pullRemote(false),4000);}
function stopPolling(){if(SYNC.poll){clearInterval(SYNC.poll);SYNC.poll=null;}}
function classifyErr(e){const s=(e&&(e.message||e.code)||String(e)||'');if(/Failed to fetch|NetworkError|fetch|ERR_|CORS|network/i.test(s))return 'network';if(/row-level security|permission|not authoriz|RLS|policy|401|403/i.test(s))return 'rls';if(/does not exist|schema cache|Could not find the table|relation/i.test(s))return 'notable';return 'other';}
async function syncTest(){
  const cfg=getCfg();
  const isFile=(typeof location!=='undefined'&&location.protocol==='file:');
  const showSrc='מקור: '+(typeof location!=='undefined'?location.protocol+'//'+(location.host||'(קובץ מקומי)'):'');
  if(!(window.supabase&&window.supabase.createClient)){openSheet('<b>בדיקת סנכרון</b><p class="small muted">ספריית הסנכרון לא נטענה (jsdelivr חסום ברשת?).<br>'+escapeHtml(showSrc)+'</p><button class="btn sec" style="margin-top:10px" onclick="closeSheet()">סגור</button>');return;}
  if(!cfg||!SYNC.client){openSheet('<b>בדיקת סנכרון</b><p class="small muted">הסנכרון לא מאותחל.</p><button class="btn sec" style="margin-top:10px" onclick="closeSheet()">סגור</button>');return;}
  openSheet('<b>בדיקת סנכרון</b><p class="small muted">בודק כתיבה וקריאה מול Supabase…</p>');
  let msg='';
  try{
    const wr=await SYNC.client.from('fifa_rooms').upsert({room:cfg.room,data:{players:state.players,matches:state.matches,deleted:state.deleted,control:state.control},updated_at:new Date().toISOString()});
    if(wr.error){
      const t=classifyErr(wr.error);const raw=wr.error.message||wr.error.code||JSON.stringify(wr.error);
      if(t==='network')msg='❌ כתיבה נכשלה — בעיית רשת:\n'+raw+'\n\nהסיבות הנפוצות:\n1. פתחת מקובץ מקומי (file://) במקום מהקישור של GitHub — Supabase חוסם בקשות מ-file. פתח את כתובת ה-github.io.\n2. הפרויקט ב-Supabase מושהה (Paused) — היכנס ל-dashboard ולחץ Restore/Resume.\n3. חוסם פרסומות/רשת חוסמים את supabase.co.';
      else if(t==='rls')msg='❌ כתיבה נכשלה — הרשאות RLS:\n'+raw+'\n\nהרץ מחדש את ה-SQL של ה-policy.';
      else if(t==='notable')msg='❌ הטבלה fifa_rooms לא נמצאה:\n'+raw+'\n\nהרץ את ה-SQL שיוצר את הטבלה.';
      else msg='❌ כתיבה נכשלה:\n'+raw;
    }else{
      const rd=await SYNC.client.from('fifa_rooms').select('room,updated_at').eq('room',cfg.room).maybeSingle();
      if(rd.error)msg='⚠️ כתיבה עבדה אך קריאה נכשלה:\n'+(rd.error.message||JSON.stringify(rd.error));
      else msg='✅ תקין! כתיבה וקריאה עובדות.\nחדר: '+cfg.room+'\n'+showSrc+'\n\nאם עדיין לא מסתנכרן — ודא שכולם פותחים את אותו קישור github.io ואותו קוד חדר.';
    }
  }catch(e){
    const t=classifyErr(e);
    msg=(t==='network'?'❌ בעיית רשת:\n':'❌ שגיאה:\n')+String(e&&e.message||e)+(isFile?'\n\n⚠️ פתחת מקובץ מקומי (file://) — זה חוסם את Supabase. פתח מכתובת ה-github.io.':'');
  }
  openSheet('<b>בדיקת סנכרון</b><pre class="small" style="direction:ltr;text-align:left;white-space:pre-wrap;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px">'+escapeHtml(msg)+'</pre><button class="btn sec" style="margin-top:10px" onclick="closeSheet()">סגור</button>');
}
function mergeRemote(remote){
  const rp=remote.players||[],rm=remote.matches||[],rd=remote.deleted||[];
  const before=JSON.stringify(state);
  const pmap={};state.players.forEach(p=>pmap[p.id]=p);rp.forEach(p=>{if(!pmap[p.id])pmap[p.id]=p;});
  const mmap={};state.matches.forEach(m=>mmap[m.id]=m);rm.forEach(m=>{if(!mmap[m.id])mmap[m.id]=m;});
  const del=Array.from(new Set([...(state.deleted||[]),...rd]));
  state.players=Object.values(pmap);state.matches=Object.values(mmap);state.deleted=del;
  if(remote.control&&(remote.control.updatedAt||0)>((state.control&&state.control.updatedAt)||0))state.control=remote.control;
  const deduped=dedupePlayers();
  persist();
  const after=JSON.stringify(state);
  if(after!==before){SYNC.applyingRemote=true;render();SYNC.applyingRemote=false;}
  if(deduped||(rp.length!==state.players.length)||(rm.length!==state.matches.length)||(rd.length!==del.length))pushState();
}
function pushState(){if(!SYNC.client)return;const cfg=getCfg();if(!cfg)return;try{SYNC.client.from('fifa_rooms').upsert({room:cfg.room,data:{players:state.players,matches:state.matches,deleted:state.deleted,control:state.control},updated_at:new Date().toISOString()}).then(({error})=>{if(error){SYNC.ok=false;SYNC.lastErr=error.message||error.code||JSON.stringify(error);updateSyncDot();}else{SYNC.lastErr=null;}});}catch(e){SYNC.lastErr=String(e&&e.message||e);}}
function syncPush(){if(SYNC.applyingRemote)return;if(SYNC.client)pushState();}
function updateSyncDot(){
  const cfg=getCfg();const d=document.getElementById('syncDot');
  if(d){d.className='syncdot'+(cfg?(SYNC.ok?' on':' err'):'');d.title=cfg?(SYNC.ok?'סנכרון חי':'סנכרון מתחבר'):'סנכרון כבוי';}
  const key=(SYNC.ok?'1':'0')+'|'+(SYNC.lastErr||'');
  if(key!==SYNC._uiKey){SYNC._uiKey=key;if(!SYNC.applyingRemote&&(ui.tab==='more'||ui.tab==='play')){const v=document.getElementById('view');if(v)v.innerHTML=(ui.tab==='more'?viewMore():viewPlay());}}
}

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0f0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ליגת פיפ״א</title>
<style>
:root{
  --bg:#0a0f0a; --bg2:#0f1710; --card:#141d15; --card2:#1a2a1c;
  --line:#233626; --line2:#2f4a34;
  --txt:#eaf5ea; --dim:#8fae94; --dim2:#6a866f;
  --accent:#39e08a; --accent2:#26c46f; --accentink:#052013;
  --gold:#ffd25a; --silver:#cfe0e6; --bronze:#e0925a;
  --win:#39e08a; --loss:#ff6b6b; --draw:#f4c04b; --tech:#b98bff;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #10251a 0%, var(--bg) 55%) fixed, var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Assistant",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  min-height:100vh;
}
.app{max-width:560px;margin:0 auto;padding:0 14px}
header.top{
  position:sticky;top:0;z-index:40;
  padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
  background:linear-gradient(180deg, rgba(10,15,10,.96), rgba(10,15,10,.75) 70%, transparent);
  backdrop-filter:blur(10px);
  max-width:560px;margin:0 auto;
  display:flex;align-items:center;gap:10px;
}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.3px;font-size:19px}
.logo .ball{width:26px;height:26px;border-radius:50%;background:
   radial-gradient(circle at 35% 30%, #fff 0 22%, transparent 23%),
   conic-gradient(from 20deg,#111,#333 25%,#111 26% 50%,#333 51% 75%,#111 76%);
   box-shadow:0 2px 8px rgba(0,0,0,.5), inset 0 0 0 2px #0006;flex:0 0 auto}
.logo b{color:var(--accent)}
.top .spacer{flex:1}
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--dim2);box-shadow:0 0 0 3px #0003}
.syncdot.on{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.syncdot.err{background:var(--loss)}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:12px;font-size:17px;display:flex;align-items:center;justify-content:center}

h2.section{font-size:13px;letter-spacing:.6px;color:var(--dim);margin:22px 4px 10px;font-weight:800}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.muted{color:var(--dim)}
.small{font-size:12px}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.tag-win{color:var(--win)} .tag-loss{color:var(--loss)} .tag-draw{color:var(--draw)} .tag-tech{color:var(--tech)}
.btn{appearance:none;border:none;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:800;color:var(--accentink);background:linear-gradient(180deg,var(--accent),var(--accent2));box-shadow:0 8px 20px rgba(57,224,138,.25);width:100%;letter-spacing:.3px}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line2);box-shadow:none}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);box-shadow:none;font-weight:700}
.btn.danger{background:#2a1414;color:#ff8f8f;border:1px solid #522;box-shadow:none}
.btn.tech{background:linear-gradient(180deg,#a879ff,#8b5bff);color:#150826;box-shadow:0 8px 20px rgba(139,91,255,.25)}
.btn:disabled{opacity:.4}
input,select{font-family:inherit;font-size:16px;color:var(--txt);background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px;width:100%;text-align:right}
input::placeholder{color:var(--dim2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.av{flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#06130b;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.av.sm{width:30px;height:30px;font-size:13px}
.av.md{width:40px;height:40px;font-size:16px}
.av.lg{width:64px;height:64px;font-size:26px}

.modeswitch{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.modeswitch button{flex:1;border:none;background:transparent;color:var(--dim);font-weight:800;font-size:15px;padding:11px;border-radius:10px}
.modeswitch button.act{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--accentink)}
.teamblock{margin-top:12px}
.teamlabel{font-size:12px;font-weight:800;color:var(--dim);margin:0 2px 8px;display:flex;justify-content:space-between}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{flex:1;min-width:130px;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px dashed var(--line2);border-radius:14px;padding:8px 10px;min-height:52px}
.slot.filled{border-style:solid;background:var(--card2)}
.slot .name{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .x{color:var(--dim2);font-size:18px;padding:0 4px}
.vs{text-align:center;color:var(--dim2);font-weight:900;letter-spacing:2px;margin:10px 0 2px;font-size:13px}
.scorewrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:14px}
.scorebox{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:12px;text-align:center}
.scorebox .lab{font-size:11px;color:var(--dim);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scorebox .num{font-size:42px;font-weight:900;line-height:1;margin:6px 0}
.stepbtns{display:flex;gap:6px;justify-content:center}
.stepbtns button{width:38px;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);color:var(--txt);font-size:20px;font-weight:800}
.dash{color:var(--dim2);font-size:26px;font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{border:1px solid var(--line2);background:var(--card2);color:var(--txt);border-radius:11px;padding:8px 11px;font-weight:800;font-size:14px}
.chip.act{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--accentink);border-color:transparent}
.techbar{margin-top:14px;padding:12px;border-radius:14px;border:1px dashed var(--tech);background:rgba(139,91,255,.08)}
.techbar .h{font-weight:800;color:var(--tech);font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.techbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.techbtns button{border:1px solid var(--tech);background:rgba(139,91,255,.12);color:#e6d9ff;border-radius:12px;padding:11px;font-weight:800;font-size:14px}
.techbtns button:disabled{opacity:.4}

.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:60;display:none}
.sheet-back.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:82vh;overflow:auto}
.sheet.on{transform:translateY(0)}
.grabber{width:42px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.picklist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.pickrow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.pickrow.dis{opacity:.35}
.pickrow .name{font-weight:700;flex:1}
.pickrow .r{font-size:13px;color:var(--dim);font-weight:700}

.lb-row{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--line)}
.lb-row:last-child{border-bottom:none}
.rank{width:26px;text-align:center;font-weight:900;color:var(--dim);font-size:15px;flex:0 0 auto}
.lb-main{flex:1;min-width:0}
.lb-main .nm{font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lb-main .sub{font-size:12px;color:var(--dim);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.rating .d{font-size:11px;font-weight:800;display:block;margin-top:1px}
.up{color:var(--win)} .down{color:var(--loss)} .flat{color:var(--dim2)}
.form{display:flex;gap:3px}
.fdot{width:16px;height:16px;border-radius:5px;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#06130b}
.fW{background:var(--win)} .fL{background:var(--loss);color:#2a0a0a} .fD{background:var(--draw)}
.streakbadge{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px}
.hot{background:linear-gradient(180deg,#ff8a3d,#ff5a3d);color:#2a0a00}
.cold{background:#16344a;color:#8fd0ff}
.techbadge{background:rgba(139,91,255,.18);color:#d9c6ff;border:1px solid var(--tech);font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px}

.match{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:none}
.match .side{flex:1;min-width:0}
.match .side .who{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .side.left{text-align:left}
.match .sc{font-weight:900;font-size:18px;padding:4px 10px;border-radius:11px;background:var(--bg2);border:1px solid var(--line2);white-space:nowrap}
.match .sc.techsc{border-color:var(--tech);background:rgba(139,91,255,.12)}
.match .meta{font-size:11px;color:var(--dim2);margin-top:2px}
.winbold{color:var(--txt)} .losedim{color:var(--dim2)}

.prof-head{display:flex;align-items:center;gap:14px}
.prof-head .nm{font-size:22px;font-weight:900}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center}
.stat .v{font-size:20px;font-weight:900}
.stat .k{font-size:11px;color:var(--dim);margin-top:2px}
.bar{height:10px;border-radius:6px;background:var(--bg2);overflow:hidden;display:flex;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.spark{width:100%;height:56px;display:block}
.h2h-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.h2h-row:last-child{border-bottom:none}
.h2h-rec{font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}

.rec{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:none}
.rec .ic{width:40px;height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.rec .t{font-size:12px;color:var(--dim);font-weight:700}
.rec .v{font-weight:800;margin-top:1px}

nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;max-width:560px;margin:0 auto;
  background:linear-gradient(180deg,rgba(15,23,16,.7),rgba(10,15,10,.98));
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
nav.bottom button{flex:1;background:none;border:none;color:var(--dim2);font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
nav.bottom button .i{font-size:20px;line-height:1}
nav.bottom button.act{color:var(--accent)}

.empty{text-align:center;color:var(--dim);padding:34px 14px}
.empty .big{font-size:40px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line2);color:var(--txt);padding:11px 18px;border-radius:999px;font-weight:800;z-index:80;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.linkish{color:var(--accent);font-weight:800;text-decoration:underline;background:none;border:none;padding:0;font-size:inherit}
.divlist>*{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.kv{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv b{font-weight:800;direction:ltr}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;width:100%;min-height:120px;background:var(--bg2);color:var(--txt);border:1px solid var(--line2);border-radius:12px;padding:10px;direction:ltr;text-align:left}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.seg button{border:1px solid var(--line2);background:var(--card2);color:var(--dim);border-radius:999px;padding:6px 13px;font-weight:800;font-size:13px}
.seg button.act{background:var(--accent);color:var(--accentink);border-color:transparent}
.num,.rating,.scorebox .num,.sc,.rank{direction:ltr}
</style>
</head>
<body>

<header class="top">
  <div class="logo"><span class="ball"></span><span>ליגת<b> פיפ״א</b></span></div>
  <div class="spacer"></div>
  <div id="syncDot" class="syncdot" title="סנכרון"></div>
  <button class="iconbtn" onclick="go('more')">⚙</button>
</header>

<main class="app" id="view"></main>

<nav class="bottom">
  <button data-tab="play" onclick="go('play')"><span class="i">⚽</span>משחק</button>
  <button data-tab="ranks" onclick="go('ranks')"><span class="i">🏆</span>דירוג</button>
  <button data-tab="feed" onclick="go('feed')"><span class="i">📜</span>היסטוריה</button>
  <button data-tab="records" onclick="go('records')"><span class="i">🥇</span>שיאים</button>
  <button data-tab="more" onclick="go('more')"><span class="i">☰</span>עוד</button>
</nav>

<div class="sheet-back" id="sheetBack" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="grabber"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="window.__sbErr=true"></script>

<script>
/* ============================================================
   ליגת פיפ״א — אפליקציה בקובץ יחיד
   מנוע הדירוג (Elo) והסטטיסטיקות הן פונקציות טהורות (ניתנות לבדיקה).
============================================================ */

const LS_KEY='fifaLeague.he.v2';
const CFG_KEY='fifaLeague.sync.v2';
const COLORS=['#39e08a','#4aa8ff','#ff7ac2','#ffcf5a','#b98bff','#ff8f5a','#5ce1c9','#ff6b6b','#8be04a','#67c0ff','#ffa1d1','#c0f05a'];
const TECH_SCORE=3; // תוצאת ברירת מחדל לניצחון טכני: 3-0

let state={players:[],matches:[],deleted:[],v:2};
let ui={tab:'play',mode:'2v2',teamA:[],teamB:[],sa:0,sb:0,profileId:null,feedFilter:'all',ranksMode:'all',lastReused:false};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function now(){return Date.now();}
function load(){try{const raw=localStorage.getItem(LS_KEY);if(raw){state=Object.assign({players:[],matches:[],deleted:[],v:2},JSON.parse(raw));}}catch(e){}}
function persist(){localStorage.setItem(LS_KEY,JSON.stringify(state));}
function save(){persist();syncPush();}

function P(id){return state.players.find(p=>p.id===id);}
function pname(id){const p=P(id);return p?p.name:'?';}
function initials(n){return n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('');}
function avatar(id,size='sm'){const p=P(id);if(!p)return '';return `<span class="av ${size}" style="background:${p.color}">${escapeHtml(initials(p.name))}</span>`;}
function escapeHtml(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function activeMatches(){return state.matches.filter(m=>!state.deleted.includes(m.id));}
function pairKey(a,b){return [a,b].sort().join('|');}
function teamNames(team){return team.map(id=>pname(id)).join(' + ');}

/* ============================================================
   מנוע Elo + סטטיסטיקות
============================================================ */
const ELO_START=1000, ELO_K=32;
function eloExpected(ra,rb){return 1/(1+Math.pow(10,(rb-ra)/400));}
function movMultiplier(gd,ratingDiffWinner){if(gd===0)return 1;return Math.log(Math.abs(gd)+1)*(2.2/((ratingDiffWinner*0.001)+2.2));}

function computeStats(players,matches){
  const ids=players.map(p=>p.id);
  const R={},S={};
  ids.forEach(id=>{
    R[id]=ELO_START;
    S[id]={id,games:0,w:0,d:0,l:0,gf:0,ga:0,history:[{t:0,r:ELO_START}],peak:ELO_START,
      resultsChrono:[],curStreak:0,curType:'',longestW:0,longestUnb:0,longestL:0,
      partners:{},opps:{},big:null,mode:{'1v1':{w:0,d:0,l:0,g:0},'2v2':{w:0,d:0,l:0,g:0}},
      techW:0,techL:0,closeG:0,closeW:0};
  });
  const chem={};
  const sorted=matches.slice().sort((x,y)=>(x.ts-y.ts)||(x.id<y.id?-1:1));

  for(const m of sorted){
    if(!m.a.every(id=>R[id]!=null)||!m.b.every(id=>R[id]!=null))continue;
    const ra=m.a.reduce((s,id)=>s+R[id],0)/m.a.length;
    const rb=m.b.reduce((s,id)=>s+R[id],0)/m.b.length;
    const ea=eloExpected(ra,rb),eb=1-ea;
    const aWin=m.sa>m.sb,bWin=m.sb>m.sa,draw=m.sa===m.sb;
    const sA=aWin?1:(draw?0.5:0),sB=1-sA;
    const gd=Math.abs(m.sa-m.sb);
    const winnerRatingDiff=aWin?(ra-rb):bWin?(rb-ra):0;
    const mov=movMultiplier(gd,winnerRatingDiff);
    const dA=ELO_K*mov*(sA-ea),dB=ELO_K*mov*(sB-eb);
    applyTeam(m.a,m.b,dA,m.sa,m.sb,sA,m);
    applyTeam(m.b,m.a,dB,m.sb,m.sa,sB,m);
    if(m.mode==='2v2'){recordChem(m.a,sA);recordChem(m.b,sB);}
  }
  function recordChem(team,res){
    if(team.length<2)return;
    for(let i=0;i<team.length;i++)for(let j=i+1;j<team.length;j++){
      const k=pairKey(team[i],team[j]);
      const c=chem[k]||(chem[k]={a:team[i],b:team[j],g:0,w:0,d:0,l:0});
      c.g++;if(res===1)c.w++;else if(res===0.5)c.d++;else c.l++;
    }
  }
  function applyTeam(team,opp,delta,gf,ga,res,m){
    const gd=Math.abs(m.sa-m.sb);
    for(const id of team){
      R[id]+=delta;const st=S[id];
      st.games++;st.gf+=gf;st.ga+=ga;st.mode[m.mode].g++;
      if(res===1){st.w++;st.mode[m.mode].w++;if(m.tech)st.techW++;}
      else if(res===0.5){st.d++;st.mode[m.mode].d++;}
      else {st.l++;st.mode[m.mode].l++;if(m.tech)st.techL++;}
      if(gd===1){st.closeG++;if(res===1)st.closeW++;}
      st.history.push({t:m.ts,r:R[id]});
      if(R[id]>st.peak)st.peak=R[id];
      const rc=res===1?'W':res===0.5?'D':'L';
      st.resultsChrono.push(rc);
      for(const t of team){if(t===id)continue;const pp=st.partners[t]||(st.partners[t]={g:0,w:0,d:0,l:0});pp.g++;if(rc==='W')pp.w++;else if(rc==='D')pp.d++;else pp.l++;}
      for(const o of opp){const oo=st.opps[o]||(st.opps[o]={g:0,w:0,d:0,l:0});oo.g++;if(rc==='W')oo.w++;else if(rc==='D')oo.d++;else oo.l++;}
      if(res===1&&(!st.big||(gf-ga)>st.big.margin))st.big={margin:gf-ga,gf,ga,opp:opp.slice(),ts:m.ts,mode:m.mode,tech:!!m.tech};
    }
  }
  ids.forEach(id=>{
    const st=S[id];st.rating=Math.round(R[id]);
    let cs=0,ct='';for(let i=st.resultsChrono.length-1;i>=0;i--){const r=st.resultsChrono[i];if(i===st.resultsChrono.length-1){ct=r;cs=1;}else if(r===ct){cs++;}else break;}
    st.curStreak=cs;st.curType=ct;
    let lw=0,cur=0,lu=0,curu=0,ll=0,curl=0;
    for(const r of st.resultsChrono){
      if(r==='W'){cur++;curu++;curl=0;}else if(r==='D'){cur=0;curu++;curl=0;}else{cur=0;curu=0;curl++;}
      if(cur>lw)lw=cur;if(curu>lu)lu=curu;if(curl>ll)ll=curl;
    }
    st.longestW=lw;st.longestUnb=lu;st.longestL=ll;
    st.form=st.resultsChrono.slice(-5);
    st.gd=st.gf-st.ga;
    st.winpct=st.games?(st.w/st.games*100):0;
    st.ppg=st.games?((st.w*3+st.d)/st.games):0;
    st.gpg=st.games?(st.gf/st.games):0;
    st.gapg=st.games?(st.ga/st.games):0;
    st.clutchPct=st.closeG?(st.closeW/st.closeG*100):0;
    const h=st.history;st.lastDelta=h.length>1?Math.round(h[h.length-1].r-h[h.length-2].r):0;
    st.bestPartner=pickRel(st.partners,true);
    st.worstPartner=pickRel(st.partners,false);
    st.nemesis=pickRel(st.opps,false);
    st.bunny=pickRel(st.opps,true);
  });
  function rate(o){return o.g?(o.w+o.d*0.5)/o.g:0;}
  function pickRel(map,best){
    let arr=Object.entries(map).filter(([,v])=>v.g>=2);
    if(!arr.length)return null;
    arr.sort((a,b)=>best?(rate(b[1])-rate(a[1]))||(b[1].g-a[1].g):(rate(a[1])-rate(b[1]))||(b[1].g-a[1].g));
    const [id,v]=arr[0];return {id,...v,rate:rate(v)};
  }
  const chemArr=Object.values(chem).map(c=>({...c,rate:c.g?(c.w+c.d*0.5)/c.g:0}));
  return {S,chem:chemArr,ranked:ids.map(id=>S[id])};
}

function computeRecords(players,matches,stats){
  const rec=[],ms=matches;
  if(!ms.length)return rec;
  let bo=null;ms.forEach(m=>{if(m.tech)return;const gd=Math.abs(m.sa-m.sb);if(!bo||gd>bo.gd)bo={gd,m};});
  if(bo){const m=bo.m;const win=m.sa>m.sb?m.a:m.b,lo=m.sa>m.sb?m.b:m.a;const ws=Math.max(m.sa,m.sb),ls=Math.min(m.sa,m.sb);rec.push({ic:'💥',t:'המחיקה הגדולה ביותר',v:`${teamNames(win)} ${ws}–${ls} ${teamNames(lo)}`});}
  let mg=null;ms.forEach(m=>{if(m.tech)return;const x=Math.max(m.sa,m.sb);if(!mg||x>mg.x)mg={x,m};});
  if(mg){const m=mg.m;const win=m.sa>=m.sb?m.a:m.b;rec.push({ic:'🎯',t:'הכי הרבה שערים במשחק אחד',v:`${teamNames(win)} — ${mg.x} שערים`});}
  let hs=null;ms.forEach(m=>{if(m.tech)return;const t=m.sa+m.sb;if(!hs||t>hs.t)hs={t,m};});
  if(hs){const m=hs.m;rec.push({ic:'🔥',t:'המשחק עם הכי הרבה שערים',v:`${teamNames(m.a)} ${m.sa}–${m.sb} ${teamNames(m.b)} (${hs.t})`});}
  let pk=null;stats.ranked.forEach(s=>{if(s.games&&(!pk||s.peak>pk.peak))pk={peak:Math.round(s.peak),id:s.id};});
  if(pk)rec.push({ic:'📈',t:'הדירוג הגבוה בכל הזמנים',v:`${pname(pk.id)} — ${pk.peak}`});
  let lw=null;stats.ranked.forEach(s=>{if(s.longestW&&(!lw||s.longestW>lw.n))lw={n:s.longestW,id:s.id};});
  if(lw)rec.push({ic:'⚡',t:'רצף הנצחונות הארוך ביותר',v:`${pname(lw.id)} — ${lw.n} ברצף`});
  let lu=null;stats.ranked.forEach(s=>{if(s.longestUnb&&(!lu||s.longestUnb>lu.n))lu={n:s.longestUnb,id:s.id};});
  if(lu)rec.push({ic:'🛡️',t:'הרצף הארוך ללא הפסד',v:`${pname(lu.id)} — ${lu.n} משחקים`});
  // מלך הטכני
  let tk=null;stats.ranked.forEach(s=>{if(s.techW&&(!tk||s.techW>tk.n))tk={n:s.techW,id:s.id};});
  if(tk)rec.push({ic:'⚖️',t:'👑 מלך הטכני',v:`${pname(tk.id)} — ${tk.n} נצחונות טכניים`});
  let tl=null;stats.ranked.forEach(s=>{if(s.techL&&(!tl||s.techL>tl.n))tl={n:s.techL,id:s.id};});
  if(tl)rec.push({ic:'🏳️',t:'הכי הרבה ספג טכני',v:`${pname(tl.id)} — ${tl.n} פעמים`});
  let ma=null;stats.ranked.forEach(s=>{if(!ma||s.games>ma.g)ma={g:s.games,id:s.id};});
  if(ma&&ma.g)rec.push({ic:'🏃',t:'הכי הרבה משחקים',v:`${pname(ma.id)} — ${ma.g}`});
  const duos=stats.chem.filter(c=>c.g>=3).sort((a,b)=>b.rate-a.rate||b.g-a.g);
  if(duos.length)rec.push({ic:'🤝',t:'הצמד הקטלני',v:`${pname(duos[0].a)} + ${pname(duos[0].b)} — ${Math.round(duos[0].rate*100)}% (${duos[0].g} מש׳)`});
  let bp=null;stats.ranked.forEach(s=>{if(s.games>=3&&(!bp||s.winpct>bp.p))bp={p:s.winpct,id:s.id};});
  if(bp)rec.push({ic:'👑',t:'אחוז הנצחונות הגבוה (3+ מש׳)',v:`${pname(bp.id)} — ${Math.round(bp.p)}%`});
  let cl=null;stats.ranked.forEach(s=>{if(s.closeG>=3&&(!cl||s.clutchPct>cl.p))cl={p:s.clutchPct,id:s.id,g:s.closeG};});
  if(cl)rec.push({ic:'🧊',t:'מלך הרגעים הצמודים (הכרעה בשער)',v:`${pname(cl.id)} — ${Math.round(cl.p)}% מתוך ${cl.g}`});
  return rec;
}

    <div class="kv" style="margin-top:12px"><span class="muted">כושר נוכחי</span><b>${formHtml(s.form)}</b></div>

function relRow(label,r){const pct=Math.round(r.rate*100);return `<div class="h2h-row">${avatar(r.id,'md')}<div style="flex:1"><div class="small muted">${label}</div><b>${escapeHtml(pname(r.id))}</b></div><div style="text-align:left"><div class="h2h-rec">${r.w}-${r.d}-${r.l}</div><div class="small muted">${pct}%</div></div></div>`;}
function h2hCard(s){
  const opps=Object.entries(s.opps).sort((a,b)=>b[1].g-a[1].g);
  if(!opps.length)return '';
  return `<h2 class="section">ראש בראש</h2><div class="card">${opps.map(([id,v])=>{const pct=v.g?Math.round((v.w+v.d*0.5)/v.g*100):0;return `<div class="h2h-row">${avatar(id,'sm')}<div style="flex:1"><b>${escapeHtml(pname(id))}</b><div class="small muted">${v.g} משחקים</div></div><div style="width:120px"><div class="bar"><i style="width:${v.g?v.w/v.g*100:0}%;background:var(--win)"></i><i style="width:${v.g?v.d/v.g*100:0}%;background:var(--draw)"></i><i style="width:${v.g?v.l/v.g*100:0}%;background:var(--loss)"></i></div><div class="small muted center" style="margin-top:3px" dir="ltr">${v.w}-${v.d}-${v.l} · ${pct}%</div></div></div>`;}).join('')}</div>`;
}
function sparkline(history){
  if(!history||history.length<2)return '<div class="small muted center" style="margin:12px 0">גרף הדירוג יופיע אחרי כמה משחקים.</div>';
  const pts=history.map(h=>h.r);const min=Math.min(...pts),max=Math.max(...pts);const rng=(max-min)||1;
  const W=100,H=56,n=pts.length;
  const coords=pts.map((r,i)=>[(i/(n-1))*W,H-6-((r-min)/rng)*(H-12)]);
  const d=coords.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area=`M0 ${H} `+coords.map(c=>'L'+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ')+` L${W} ${H} Z`;
  const up=pts[pts.length-1]>=pts[0];const col=up?'#39e08a':'#ff6b6b';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="margin:12px 0 2px;transform:scaleX(-1)">
    <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#g)"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function setMode(m){ui.mode=m;if(m==='1v1'){ui.teamA=ui.teamA.slice(0,1);ui.teamB=ui.teamB.slice(0,1);}render();}
function bump(side,d){if(side==='a')ui.sa=Math.max(0,ui.sa+d);else ui.sb=Math.max(0,ui.sb+d);render();}
function quick(s){const [a,b]=s.split('-').map(Number);ui.sa=a;ui.sb=b;render();}
function swapTeams(){const t=ui.teamA;ui.teamA=ui.teamB;ui.teamB=t;const s=ui.sa;ui.sa=ui.sb;ui.sb=s;render();}
function clearSlot(side,i){const t=side==='A'?ui.teamA:ui.teamB;t.splice(i,1);ui.lastReused=false;render();}
function setRanksMode(m){ui.ranksMode=m;render();}
function setFeed(f){ui.feedFilter=f;render();}

let picker={side:null,idx:null};
function openPicker(side,idx){
  picker={side,idx};
  const used=[...ui.teamA,...ui.teamB];
  const rows=state.players.slice().sort((a,b)=>(STATS.S[b.id]?.rating||1000)-(STATS.S[a.id]?.rating||1000)).map(p=>{
    const taken=used.includes(p.id);const r=STATS.S[p.id]?.rating||1000;
    return `<div class="pickrow ${taken?'dis':''}" onclick="${taken?'':`choosePlayer('${p.id}')`}">${avatar(p.id,'md')}<span class="name">${escapeHtml(p.name)}</span><span class="r">${STATS.S[p.id]?.games?r:'—'}</span></div>`;
  }).join('');
  openSheet(`<div class="between" style="margin-bottom:4px"><b style="font-size:17px">בחירת שחקן · קבוצה ${side==='A'?'א׳':'ב׳'}</b></div>
    <div class="picklist">${rows}</div>
    <div class="row" style="margin-top:12px"><input id="quickAdd" placeholder="שחקן חדש…" onkeydown="if(event.key==='Enter')quickAddPlayer()"><button class="btn" style="width:auto;padding:13px 16px" onclick="quickAddPlayer()">הוסף</button></div>`);
}
function choosePlayer(id){const t=picker.side==='A'?ui.teamA:ui.teamB;t[picker.idx]=id;ui.lastReused=false;closeSheet();render();}
function quickAddPlayer(){const el=document.getElementById('quickAdd');const n=el.value.trim();if(!n)return;const p=addPlayer(n);choosePlayer(p.id);}

function saveMatch(){
  const need=ui.mode==='2v2'?2:1;
  if(ui.teamA.length!==need||ui.teamB.length!==need)return toast('בחרו שחקנים קודם');
  if(ui.teamA.some(id=>ui.teamB.includes(id)))return toast('שחקן נמצא בשתי הקבוצות');
  const m={id:uid(),ts:now(),mode:ui.mode,a:ui.teamA.slice(),b:ui.teamB.slice(),sa:ui.sa,sb:ui.sb};
  state.matches.push(m);save();
  ui.sa=0;ui.sb=0;ui.lastReused=true;
  toast('נשמר ✓ — מוכן לריווש');render();
}
function saveTech(winnerSide){
  const need=ui.mode==='2v2'?2:1;
  if(ui.teamA.length!==need||ui.teamB.length!==need)return toast('בחרו שחקנים קודם');
  if(ui.teamA.some(id=>ui.teamB.includes(id)))return toast('שחקן נמצא בשתי הקבוצות');
  const m={id:uid(),ts:now(),mode:ui.mode,a:ui.teamA.slice(),b:ui.teamB.slice(),
    sa:winnerSide==='A'?TECH_SCORE:0, sb:winnerSide==='B'?TECH_SCORE:0, tech:true};
  state.matches.push(m);save();
  ui.sa=0;ui.sb=0;ui.lastReused=true;
  toast('⚖️ טכני! 🏳️ היריב נכנע');render();
}
function delMatch(id){if(!confirm('למחוק את המשחק?'))return;if(!state.deleted.includes(id))state.deleted.push(id);save();render();toast('נמחק');}
function editMatch(id){const m=state.matches.find(x=>x.id===id);if(!m)return;ui.mode=m.mode;ui.teamA=m.a.slice();ui.teamB=m.b.slice();ui.sa=m.sa;ui.sb=m.sb;if(!state.deleted.includes(id))state.deleted.push(id);save();go('play');toast('נטען לעריכה — עדכנו ושמרו');}

function addPlayer(name){const p={id:uid(),name:name.trim().slice(0,24),color:COLORS[state.players.length%COLORS.length],created:now()};state.players.push(p);save();return p;}
function addPlayerFromInput(elId){const el=document.getElementById(elId);const n=el.value.trim();if(!n)return;addPlayer(n);el.value='';render();setTimeout(()=>{const x=document.getElementById(elId);if(x)x.focus();},0);}
function removePlayer(id){
  const played=activeMatches().some(m=>m.a.includes(id)||m.b.includes(id));
  if(played){if(!confirm('לשחקן יש משחקים. להסיר בכל זאת? המשחקים יישארו עם השם.'))return;}
  state.players=state.players.filter(p=>p.id!==id);
  ui.teamA=ui.teamA.filter(x=>x!==id);ui.teamB=ui.teamB.filter(x=>x!==id);

function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fifa-league-data.json';a.click();}
function importPrompt(){openSheet(`<b style="font-size:17px">ייבוא נתונים</b><p class="small muted">הדביקו JSON שיוצא. זה יחליף את הנתונים במכשיר.</p><textarea id="impTxt" placeholder="{...}"></textarea><button class="btn" style="margin-top:10px" onclick="doImport()">ייבוא</button>`);}

function seedDemo(){
  if(state.matches.length&&!confirm('להוסיף שחקני ומשחקי דוגמה על הנתונים הקיימים?'))return;
  const names=['רן','עומר','נועם','דני','יעל'];
  const ids=names.map(n=>{let p=state.players.find(x=>x.name===n);if(!p)p=addPlayer(n);return p.id;});
  const [ran,omer,noam,dani,yael]=ids;
  const R=(a,b,sa,sb,mode,daysAgo,tech)=>({id:uid(),ts:now()-daysAgo*86400000-Math.floor(Math.random()*3600000),mode,a,b,sa,sb,tech:!!tech});
  const demo=[
    R([ran,omer],[noam,dani],3,1,'2v2',9),
    R([ran,noam],[omer,dani],2,2,'2v2',8),
    R([ran,dani],[omer,noam],4,0,'2v2',8),
    R([ran],[omer],2,1,'1v1',7),
    R([omer,noam],[ran,yael],1,3,'2v2',6),
    R([ran,omer],[dani,yael],5,1,'2v2',5),
    R([noam],[dani],3,3,'1v1',5),
    R([ran,omer],[noam,yael],3,0,'2v2',4,true),
    R([ran,noam],[omer,yael],2,0,'2v2',4),
    R([dani,yael],[ran,omer],2,1,'2v2',3),
    R([omer],[noam],4,2,'1v1',2),
    R([ran,yael],[noam,dani],3,2,'2v2',1),
    R([dani,omer],[ran,noam],3,0,'2v2',1,true),
    R([ran,omer],[noam,dani],1,0,'2v2',0),
  ];
  state.matches.push(...demo);save();render();toast('נטענו נתוני דוגמה ✓');
}

/* ============================================================
   סנכרון (Supabase Realtime, אופציונלי)
============================================================ */
let SYNC={client:null,channel:null,ok:false,applyingRemote:false};
function getCfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY)||'null');}catch(e){return null;}}
function setCfg(c){localStorage.setItem(CFG_KEY,JSON.stringify(c));}
function clearCfg(){localStorage.removeItem(CFG_KEY);}

function openSyncSheet(){
  const c=getCfg()||{};
  openSheet(`<b style="font-size:17px">הגדרת סנכרון חי</b>
    <p class="small muted" style="margin:6px 0 12px">הדביקו את כתובת ה-<b>Project URL</b> ואת מפתח ה-<b>anon</b> מ-Supabase (ראו קובץ ההסבר). בחרו קוד חדר שכולם ישתפו.</p>
    <label class="small muted">Project URL</label>
    <input id="s_url" placeholder="https://xxxx.supabase.co" value="${escapeHtml(c.url||'')}" style="margin:4px 0 10px;direction:ltr;text-align:left">
    <label class="small muted">anon key</label>
    <input id="s_key" placeholder="eyJ…" value="${escapeHtml(c.anon||'')}" style="margin:4px 0 10px;direction:ltr;text-align:left">
    <label class="small muted">קוד חדר (משותף לכולם)</label>
    <input id="s_room" placeholder="למשל friday-crew" value="${escapeHtml(c.room||'')}" style="margin:4px 0 10px;direction:ltr;text-align:left">
    <button class="btn" style="margin-top:6px" onclick="saveSync()">חיבור</button>
    <p class="small muted" style="margin-top:10px">המכשיר הראשון "זורע" את החדר בנתונים שלו, והאחרים מתמזגים.</p>`);
}
function saveSync(){
  const url=document.getElementById('s_url').value.trim();
  const anon=document.getElementById('s_key').value.trim();
  const room=(document.getElementById('s_room').value.trim()||'main').replace(/[^a-zA-Z0-9_-]/g,'-');
  if(!url||!anon||!room)return toast('צריך URL, מפתח וקוד חדר');
  setCfg({url,anon,room});closeSheet();initSync(true);render();
}
function disconnectSync(){try{if(SYNC.channel)SYNC.channel.unsubscribe();}catch(e){}SYNC={client:null,channel:null,ok:false,applyingRemote:false};clearCfg();render();toast('סנכרון כבוי');}

function initSync(announce){
  const cfg=getCfg();if(!cfg)return;
  if(!window.supabase||!window.supabase.createClient){SYNC.ok=false;updateSyncDot();if(announce)toast('אין חיבור — ספריית הסנכרון לא נטענה');return;}
  try{
    SYNC.client=window.supabase.createClient(cfg.url,cfg.anon);
    if(announce)toast('מתחבר…');
    SYNC.client.from('fifa_rooms').select('data').eq('room',cfg.room).maybeSingle().then(({data,error})=>{
      if(error){SYNC.ok=false;updateSyncDot();if(announce)toast('שגיאת חיבור — בדקו את הפרטים');return;}
      if(data&&data.data)mergeRemote(data.data);else pushState();
      SYNC.ok=true;updateSyncDot();
    });
    SYNC.channel=SYNC.client.channel('fifa-'+cfg.room)
      .on('postgres_changes',{event:'*',schema:'public',table:'fifa_rooms',filter:'room=eq.'+cfg.room},payload=>{
        if(payload.new&&payload.new.data)mergeRemote(payload.new.data);
      })
      .subscribe(status=>{SYNC.ok=(status==='SUBSCRIBED');updateSyncDot();});
  }catch(e){SYNC.ok=false;updateSyncDot();if(announce)toast('שגיאת סנכרון');}
}
function mergeRemote(remote){
  const rp=remote.players||[],rm=remote.matches||[],rd=remote.deleted||[];
  const before=JSON.stringify(state);
  const pmap={};state.players.forEach(p=>pmap[p.id]=p);rp.forEach(p=>{if(!pmap[p.id])pmap[p.id]=p;});
  const mmap={};state.matches.forEach(m=>mmap[m.id]=m);rm.forEach(m=>{if(!mmap[m.id])mmap[m.id]=m;});
  const del=Array.from(new Set([...(state.deleted||[]),...rd]));
  state.players=Object.values(pmap);state.matches=Object.values(mmap);state.deleted=del;
  persist();
  const after=JSON.stringify(state);
  if(after!==before){SYNC.applyingRemote=true;render();SYNC.applyingRemote=false;}
  if((rp.length!==state.players.length)||(rm.length!==state.matches.length)||(rd.length!==del.length))pushState();
}
function pushState(){if(!SYNC.client)return;const cfg=getCfg();if(!cfg)return;try{SYNC.client.from('fifa_rooms').upsert({room:cfg.room,data:{players:state.players,matches:state.matches,deleted:state.deleted},updated_at:new Date().toISOString()}).then(()=>{});}catch(e){}}
function syncPush(){if(SYNC.applyingRemote)return;if(SYNC.client)pushState();}
function updateSyncDot(){const d=document.getElementById('syncDot');if(!d)return;const cfg=getCfg();d.className='syncdot'+(cfg?(SYNC.ok?' on':' err'):'');d.title=cfg?(SYNC.ok?'סנכרון חי':'סנכרון מתחבר'):'סנכרון כבוי';}

/* ============================================================
   הפעלה
============================================================ */
load();render();
if(getCfg())initSync(false);
</script>
</body>
</html>
